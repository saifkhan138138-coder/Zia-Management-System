<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZMS Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="dashboard">

<h1>Zia Management System</h1>

<h2>Daily Management Sheet</h2>

<label>Date</label>
<input type="date">

<h3>Staff Attendance</h3>

<table border="1" width="100%">
<tr>
<th>Name</th>
<th>Time In</th>
<th>Time Out</th>
</tr>

<tr>
<td><input type="text"></td>
<td><input type="time"></td>
<td><input type="time"></td>
</tr>

<tr>
<td><input type="text"></td>
<td><input type="time"></td>
<td><input type="time"></td>
</tr>

<tr>
<td><input type="text"></td>
<td><input type="time"></td>
<td><input type="time"></td>
</tr>

</table>

<br>

<h3>Customer Due</h3>

<input type="text" placeholder="Customer Name">
<input type="number" placeholder="Due Amount">

<h3>Daily Expenses</h3>

<input type="number" placeholder="Food Expense">
<input type="number" placeholder="Maintenance">
<input type="number" placeholder="Fuel">
<input type="number" placeholder="Rent">
<input type="number" placeholder="Staff Salary">
<input type="number" placeholder="Electricity Bill">

<h3>Inventory Details</h3>

<input type="number" placeholder="Starting Cash">
<input type="number" placeholder="Cash Receiving">
<input type="number" placeholder="Total Pieces">
<input type="number" placeholder="Return Pieces">
<input type="number" placeholder="Sold Pieces">
<input type="number" placeholder="Cash in Hand">

<br><br>

<button>Save Record</button>

</div>

</body>
</html>
