<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZMS Dashboard</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
    <h1>Zia Management System</h1>
    <p>Dashboard</p>
</header>

<div class="dashboard">

    <div class="box">
        <h2>Today's Sale</h2>
        <h3 id="todaySale">Rs. 0</h3>
    </div>

    <div class="box">
        <h2>Customers</h2>
        <h3 id="customers">0</h3>
    </div>

    <div class="box">
        <h2>Expenses</h2>
        <h3 id="expenses">Rs. 0</h3>
    </div>

    <div class="box">
        <h2>Cash In Hand</h2>
        <h3 id="cash">Rs. 0</h3>
    </div>

</div>
<section class="form-section">

<h2>Daily Entry</h2>

<input type="date" id="date">

<input type="text" id="staff" placeholder="Staff Name">

<input type="time" id="timeIn">

<input type="time" id="timeOut">

<input type="number" id="sale" placeholder="Today's Sale">

<input type="text" id="customer" placeholder="Customer Name">

<input type="number" id="due" placeholder="Customer Due">

<input type="number" id="food" placeholder="Food Expense">

<input type="number" id="maintenance" placeholder="Maintenance Expense">

<input type="number" id="fuel" placeholder="Fuel Expense">

<input type="number" id="cashInHand" placeholder="Cash In Hand">

<button id="saveBtn">Save Record</button>

</section>
<script src="script.js"></script>

</body>
  </html>
