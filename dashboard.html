<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZMS Dashboard</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
    <h1>Zia Management System</h1>
    <p>Dashboard</p>
</header>

<div class="dashboard">

    <div class="box">
        <h2>Today's Sale</h2>
        <h3 id="todaySale">Rs. 0</h3>
    </div>

    <div class="box">
        <h2>Customers</h2>
        <h3 id="customers">0</h3>
    </div>

    <div class="box">
        <h2>Expenses</h2>
        <h3 id="expenses">Rs. 0</h3>
    </div>

    <div class="box">
        <h2>Cash In Hand</h2>
        <h3 id="cash">Rs. 0</h3>
    </div>

</div>

<script src="script.js"></script>

</body>
  </html>
