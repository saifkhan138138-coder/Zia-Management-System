<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zia Daily Sheet</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f3f5f7;
padding:15px;
}

.container{
max-width:700px;
margin:auto;
background:#fff;
padding:20px;
border-radius:12px;
box-shadow:0 0 10px rgba(0,0,0,.15);
}

h1{
text-align:center;
color:#0b8f4d;
margin-bottom:20px;
}

label{
display:block;
margin-top:12px;
font-weight:bold;
}

input, textarea{
width:100%;
padding:10px;
margin-top:5px;
border:1px solid #ccc;
border-radius:6px;
font-size:16px;
}

button{
width:100%;
padding:12px;
margin-top:15px;
background:#0b8f4d;
color:white;
border:none;
border-radius:6px;
font-size:17px;
cursor:pointer;
}

button:hover{
background:#08713d;
}
</style>

</head>

<body>

<div class="container">

<h1>Zia Daily Sheet</h1>

<label>Date</label>
<input type="date">

<label>Opening Balance</label>
<input type="number" placeholder="Enter Opening Balance">

<label>Staff Name</label>
<input type="text" placeholder="Enter Staff Name">

<label>Time In</label>
<input type="time">

<label>Time Out</label>
<input type="time">

<label>Daily Sale</label>
<input type="number" placeholder="Today's Sale">

<label>Expenses</label>
<input type="number" placeholder="Today's Expenses">

<label>Cash In Hand</label>
<input type="number" placeholder="Cash In Hand">

<label>Notes</label>
<textarea rows="4" placeholder="Write Notes"></textarea>

<button onclick="saveRecord()">Save Record</button>

<button onclick="window.print()">Print / Screenshot</button>

</div>
<script>
function saveRecord() {
    alert("Record Saved Successfully!");
}
</script>
</body>
  </html>
