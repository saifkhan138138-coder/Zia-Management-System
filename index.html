<title>Dollar Variety Mart Daily Sheet</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:#dcdcdc;
padding:20px;
overflow:auto;

}

.sheet{

width:1000px;
margin:auto;
background:#fff;

}

.mainTitle{

text-align:center;
font-size:34px;
font-weight:bold;

}

.subTitle{

text-align:center;
font-size:22px;
margin-top:5px;
margin-bottom:20px;

}

.topSection{

display:flex;
justify-content:space-between;
gap:20px;
margin-bottom:15px;

}

.infoBox{

flex:1;
border:2px solid #000;
padding:8px;
display:flex;
justify-content:space-between;
align-items:center;

}

.infoBox span{

font-weight:bold;
font-size:18px;

}

.infoBox input{

border:none;
outline:none;
font-size:18px;
width:180px;
text-align:center;

}

.sectionHeading{

text-align:center;
font-size:26px;
font-weight:bold;
margin:15px 0;

}

table{

width:100%;
border-collapse:collapse;

}

table th{

border:2px solid #000;
height:40px;
font-size:18px;

}

table td{

border:2px solid #000;
height:38px;

}

table input{

width:100%;
height:36px;
border:none;
outline:none;
text-align:center;
font-size:16px;

}

.time{

width:100%;

}

.number{

width:100%;

}

.text{

width:100%;

}

</style>

</head>
